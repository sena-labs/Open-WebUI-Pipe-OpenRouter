name: Public repository maintainer
on:
  workflow_call:

permissions: {}

jobs:
  maintain:
    if: >-
      github.repository_owner_id == '218400180' &&
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.workflow_ref == format('{0}/.github/workflows/maintainer.yml@{1}', github.repository, github.ref) &&
      contains(fromJSON('["sena-labs/replicate-mcp-server","sena-labs/OzBridge","sena-labs/Perplexity-tts","sena-labs/chtdb","sena-labs/agent-zero","sena-labs/awesome-mcp-servers"]'), github.repository) &&
      ((github.event_name == 'issues' && github.event.action == 'opened') ||
       github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'maintainer/issue-')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    concurrency:
      group: public-maintainer-${{ github.event.workflow_run.head_branch || format('maintainer/issue-{0}', github.event.issue.number || github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Check out the trusted relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: relay
          sparse-checkout: .github/maintainer
      - name: Check out the repository at the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
      - name: Run the maintainer or check connectivity
        working-directory: source
        env:
          PUBLIC_MAINTAINER: '1'
          AGENT_ID: agent_6afd007c3adc8191a403ddcc238908ae
          OPENAI_IDENTITY_PROVIDER_ID: idp_d837dbc2867164b25540c692
          OPENAI_SERVICE_ACCOUNT_ID: user-8d9542515ed196e437c6122d
          PILOT_BUDGET_USD: ${{ vars.MAINTAINER_BUDGET_USD }}
          GH_TOKEN: ${{ github.token }}
        run: python -I ../relay/.github/maintainer/run.py
