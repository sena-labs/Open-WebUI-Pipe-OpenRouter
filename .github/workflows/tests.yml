name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # cryptography is an optional runtime dep (Open WebUI bundles it).
          # Install it in CI so the at-rest key-encryption path is exercised;
          # the suite also covers the plaintext fallback when it is absent.
          pip install cryptography

      - name: Run tests
        run: python test_pipe.py
