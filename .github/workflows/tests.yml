name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt

      - name: Run tests
        run: |
          python test_pipe.py
          python -m unittest -v test_maintenance test_alignment

  compatibility:
    name: OWUI smoke (${{ matrix.owui-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        owui-tag: ["v0.11.4-slim", "main-slim"]
    services:
      openwebui:
        image: ghcr.io/open-webui/open-webui:${{ matrix.owui-tag }}
        ports:
          - 8080/tcp
        env:
          WEBUI_SECRET_KEY: isolated-ci-smoke-secret
          ENABLE_SIGNUP: "true"
          ENABLE_VERSION_UPDATE_CHECK: "false"
          DO_NOT_TRACK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify real function save, schemas and valves
        run: python smoke_owui.py --base-url http://127.0.0.1:${{ job.services.openwebui.ports['8080'] }}
      - name: Open WebUI logs on failure
        if: failure()
        run: docker logs ${{ job.services.openwebui.id }}
