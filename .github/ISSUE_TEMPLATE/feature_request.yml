name: Feature Request
description: Suggest a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature would you like?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why is this feature useful?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I checked [OpenRouter API docs](https://openrouter.ai/docs) to confirm this feature exists upstream
        - label: I checked [Open WebUI Pipe docs](https://docs.openwebui.com/features/extensibility/plugin/functions/pipe) for compatibility
