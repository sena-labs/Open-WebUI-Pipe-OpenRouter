name: Bug Report
description: Report a bug in OpenRouter Pipe
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: input
    id: owui-version
    attributes:
      label: Open WebUI Version
      placeholder: "e.g. 0.11.4"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g. 3.11.5"
    validations:
      required: true

  - type: input
    id: pipe-version
    attributes:
      label: Pipe Version
      placeholder: "Frontmatter version from the source you installed"
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: Deployment and install method
      placeholder: "Exact Docker image/tag, Helm or pip; pasted Python, imported URL or community hub"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: "Paste backend logs immediately after reproducing; redact secrets. Save failures may say `Failed to create a new function`, `Error loading module`, or show pip/formatter errors before the pipe loads."
      render: shell
